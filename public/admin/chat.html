<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavadísimo - Chat WhatsApp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root {
            --primary: #0a2540;
            --accent: #00d4aa;
            --success: #25d366;
            --warning: #f39c12;
            --error: #e74c3c;
            --bg-light: #f5f5f5;
            --border: #e0e0e0;
            --text-dark: #2d3436;
            --text-light: #636e72;
            --incoming-bg: #e5e5ea;
            --outgoing-bg: #dcf8c6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-light);
            min-height: 100vh;
        }

        .chat-container {
            display: flex;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            background: var(--bg-white);
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Sidebar */
        .chat-sidebar {
            width: 350px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--bg-white);
        }

        .sidebar-header {
            padding: 20px;
            background: var(--primary);
            color: var(--bg-white);
        }

        .sidebar-header h1 {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
        }

        .sidebar-header h1 i {
            color: var(--success);
        }

        .search-box {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.1);
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .conversation-item:hover {
            background: var(--bg-light);
        }

        .conversation-item.active {
            background: rgba(0, 212, 170, 0.1);
            border-left: 3px solid var(--accent);
        }

        .conversation-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            margin-right: 15px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        /* Avatar gris para chats con ventana 24hrs vencida */
        .conversation-avatar.expired {
            background: #9e9e9e !important;
            color: #e0e0e0 !important;
        }

        /* Estilo gris para conversaciones vencidas */
        .conversation-item.expired {
            background: #f5f5f5;
        }

        .conversation-item.expired .conversation-phone {
            color: #757575;
        }

        .conversation-item.expired .conversation-preview {
            color: #9e9e9e;
        }

        .conversation-item.expired .conversation-time {
            color: #bdbdbd;
        }

        /* Indicador visual de chat vencido */
        .expired-badge {
            display: inline-block;
            background: #e0e0e0;
            color: #757575;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 8px;
            font-weight: 500;
        }

        .conversation-info {
            flex: 1;
            min-width: 0;
        }

        .conversation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .conversation-phone {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 15px;
        }

        .conversation-time {
            font-size: 12px;
            color: var(--text-light);
        }

        .conversation-preview {
            font-size: 13px;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: var(--error);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 10px;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #e5ddd5;
        }

        .chat-header {
            padding: 15px 20px;
            background: var(--bg-white);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-header-phone {
            font-weight: 600;
            font-size: 16px;
            color: var(--text-dark);
        }

        .chat-header-status {
            font-size: 13px;
            color: var(--text-light);
        }

        .chat-header-actions {
            display: flex;
            gap: 10px;
        }

        .chat-header-actions button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--bg-light);
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
        }

        .chat-header-actions button:hover {
            background: var(--accent);
            color: white;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.incoming {
            align-self: flex-start;
            background: var(--incoming-bg);
            border-bottom-left-radius: 5px;
        }

        .message.outgoing {
            align-self: flex-end;
            background: var(--outgoing-bg);
            border-bottom-right-radius: 5px;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 5px;
            text-align: right;
        }

        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
        }

        .empty-chat i {
            font-size: 80px;
            color: var(--border);
            margin-bottom: 20px;
        }

        .empty-chat h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .chat-input-area {
            padding: 15px 20px;
            background: var(--bg-white);
            border-top: 1px solid var(--border);
        }

        .chat-input-form {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-input-wrapper {
            flex: 1;
            position: relative;
        }

        .chat-input {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid var(--border);
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .chat-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.1);
        }

        .send-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: var(--success);
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background: #128c7e;
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
        }

        /* Loading */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .chat-sidebar {
                width: 100%;
                position: absolute;
                z-index: 10;
                height: 100%;
            }

            .chat-sidebar.hidden {
                display: none;
            }

            .chat-area {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <aside class="chat-sidebar">
            <div class="sidebar-header">
                <h1><i class="fab fa-whatsapp"></i> Lavadísimo Peñuelas</h1>
            </div>
            <div class="search-box">
                <input type="text" id="searchPhone" placeholder="Buscar por teléfono...">
            </div>
            <div class="conversations-list" id="conversationsList">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </aside>

        <!-- Chat Area -->
        <main class="chat-area">
            <div class="empty-chat" id="emptyChat">
                <i class="fab fa-whatsapp"></i>
                <h2>Selecciona una conversación</h2>
                <p>Elige una conversación de la lista para ver los mensajes</p>
            </div>

            <div class="chat-content" id="chatContent" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <div class="conversation-avatar" id="chatAvatar">?</div>
                        <div>
                            <div class="chat-header-phone" id="chatPhone">-</div>
                            <div class="chat-header-status" id="chatStatus">Haz clic para ver info del cliente</div>
                        </div>
                    </div>
                    <div class="chat-header-actions">
                        <button title="Llamar al cliente" id="btnCall">
                            <i class="fas fa-phone"></i>
                        </button>
                        <button title="Ver historial de órdenes" id="btnOrders">
                            <i class="fas fa-shopping-bag"></i>
                        </button>
                        <button title="Cerrar sesión" id="btnLogout">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>

                <div class="messages-container" id="messagesContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>

                <div class="chat-input-area">
                    <form class="chat-input-form" id="messageForm">
                        <div class="chat-input-wrapper">
                            <input type="text" class="chat-input" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off">
                        </div>
                        <button type="submit" class="send-btn" id="sendBtn" disabled>
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/chat.js"></script>
</body>
</html>
